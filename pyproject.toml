[project]
name = "invenio-config-tugraz"
description = "Invenio module that adds tugraz configs."
readme = "README.md"
license = "MIT"
authors = [{ name = "Graz University of Technology." }]
keywords = ["TU-Graz", "config", "invenio"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
]
urls = { "Repository" = "https://github.com/tu-graz-library/invenio-config-tugraz" }
dependencies = [
  "invenio-cache>=3.0.0",
  "invenio-curations>=0.6.0",
  "invenio-global-search>=0.3.0",
  "invenio-i18n>=2.0.0",
  "invenio-rdm-records>=32.0.0",
  "invenio-records-lom>=0.20.0",
  "invenio-records-marc21>=0.27.0",
  "invenio-catalogue-marc21>=0.5.0"
]
dynamic = ["version"]

[project.entry-points."invenio_assets.webpack"]
invenio_config_tugraz = "invenio_config_tugraz.webpack:theme"

# notices: extract to invenio-notices later
[project.entry-points."invenio_base.api_blueprints"]
invenio_config_tugraz_notices = "invenio_config_tugraz.notices:api_blueprint"

[project.entry-points."invenio_base.apps"]
invenio_config_tugraz = "invenio_config_tugraz:InvenioConfigTugraz"

[project.entry-points."invenio_base.blueprints"]
invenio_config_tugraz = "invenio_config_tugraz.views:ui_blueprint"

[project.entry-points."invenio_base.finalize_app"]
invenio_config_tugraz = "invenio_config_tugraz.ext:finalize_app"

[project.entry-points."invenio_config.module"]
# this is a hacky solution to be "sure" that this configuration is applied
# the last and overrides the configuration from invenio-overrides (see
# https://github.com/inveniosoftware/invenio-config/blob/master/invenio_config/entrypoint.py#L41).
# this solution enables preserves that invenio.cfg can set values as default and
# environment variables can override the configuration variables (see
# https://github.com/inveniosoftware/invenio-config/blob/master/invenio_config/env.py#L41)
z_latest_to_apply_config_module = "invenio_config_tugraz.config"

[project.entry-points."invenio_db.alembic"]
invenio_config_tugraz = "invenio_config_tugraz:alembic"

[project.entry-points."invenio_db.models"]
invenio_config_tugraz = "invenio_config_tugraz.models"

[project.entry-points."invenio_i18n.translations"]
messages = "invenio_config_tugraz"

[project.optional-dependencies]
tests = [
  "invenio-app>=3.0.0",
  "invenio-app-rdm>=14.0.0,<15.0.0",
  "invenio-search[opensearch2]>=2.1.0",
  "pytest-black>=0.6.0",
  "pytest-invenio>=4.0.0",
  "ruff>=0.5.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.babel]
[tool.babel.compile_catalog]
directory = "invenio_config_tugraz/translations/"

[tool.babel.extract_messages]
copyright_holder = "Graz University of Technology"
mapping_file = "pyproject.toml"
output_file = "invenio_config_tugraz/translations/messages.pot"
add_comments = "NOTE"

[tool.babel.init_catalog]
input_file = "invenio_config_tugraz/translations/messages.pot"
output_dir = "invenio_config_tugraz/translations/"

[[tool.babel.mappings]]
method = "javascript"
pattern = "**.js"
encoding = "utf-8"
extract_messages = "$._, jQuery._"

[[tool.babel.mappings]]
method = "python"
pattern = "**.py"
encoding = "utf-8"

[[tool.babel.mappings]]
method = "jinja2"
pattern = "**/templates/**.html"
encoding = "utf-8"

[tool.hatch.build]
artifacts = [
  "*.mo",
]
exclude = [
  ".github/**",
  "tests/**",
  ".gitignore",
  "run-tests.sh",
]

[tool.hatch.build.targets.sdist]
include = ["/invenio_config_tugraz"]

[tool.hatch.version]
path = "invenio_config_tugraz/__init__.py"

[tool.isort]
profile = "black"

[tool.mypy]
extra_checks = true
strict = true
strict_bytes = true
strict_equality = true
follow_untyped_imports = true
disallow_any_generics = false
python_executable = ".venv/bin/python"

[tool.pytest.ini_options]
addopts = "--black --isort --cov=invenio_config_tugraz --cov-report=term-missing"
testpaths = "tests invenio_config_tugraz"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D203",
  "D211",
  "D212",
  "D213",
  "E501",
  "ERA001",
  "FA102",
  "FIX002",
  "I001",
  "INP001",
  "N999",
  "RUF005",
  "RUF012",
  "S101",
  "TD002",
  "TD003",
  "UP009",
]

[tool.ruff.lint.flake8-copyright]
notice-rgx = "(?i)# SPDX-FileCopyrightText:\\s\\d{4}(-(\\d{4}|present))*"
